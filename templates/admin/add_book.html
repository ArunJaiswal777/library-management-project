<!DOCTYPE html>
<html>
<head>
    <title>Add Book</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">📚 Library Management</div>

        <div class="nav-links">
            <a href="/">🏠 Home</a>
            <a href="/admin/books" class="active">📚 Books</a>
            <a href="/admin/add-book">➕ Add Book</a>
            <a href="/admin/students">👨‍🎓 Students</a>
            <a href="/admin/add-student">➕ Add Student</a>
            <a href="/admin/issue-book">📖 Issue Book</a>
            <a href="/admin/issues">📋 Issues</a>
            <a href="/chatbot">🤖 Chatbot</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>Add New Book</h1>
                <p class="subtitle">Add a book to the library catalog</p>
            </div>
            <a href="/admin/books" class="btn btn-secondary">← Back to Books</a>
        </div>

        <div class="form-card">
            <form method="POST">
                <div class="form-group">
                    <label for="title">Book Title</label>
                    <input class="form-control" type="text" id="title" name="title" required>
                </div>

                <div class="form-group">
                    <label for="author">Author</label>
                    <input class="form-control" type="text" id="author" name="author" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <input class="form-control" type="text" id="category" name="category">
                </div>

                <div class="form-group">
                    <label for="isbn">ISBN</label>
                    <input class="form-control" type="text" id="isbn" name="isbn">
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input class="form-control" type="number" id="quantity" name="quantity" min="1" required>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-success">Add Book</button>
                    <a href="/admin/books" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <div class="footer">Library Management System © 2026</div>

</body>
</html>
