<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">📚 Library Management</div>

        <div class="nav-links">
            <a href="/">🏠 Home</a>
            <a href="/admin/books">📚 Books</a>
            <a href="/admin/students" class="active">👨‍🎓 Students</a>
            <a href="/admin/add-student">➕ Add Student</a>
            <a href="/admin/issue-book">📖 Issue Book</a>
            <a href="/admin/issues">📋 Issues</a>
            <a href="/chatbot">🤖 Chatbot</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>Add New Student</h1>
                <p class="subtitle">Register a student to the library</p>
            </div>
            <a href="/admin/students" class="btn btn-secondary">← Back to Students</a>
        </div>

        <div class="form-card">
            <form method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input
                        class="form-control"
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter student name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Gmail</label>
                    <input
                        class="form-control"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        pattern="[a-zA-Z0-9._%+-]+@gmail\.com"
                        title="Please enter a valid Gmail address, for example example@gmail.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        class="form-control"
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter 10 digit phone number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        minlength="10"
                        title="Phone number must contain exactly 10 digits"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <input
                        class="form-control"
                        type="text"
                        id="course"
                        name="course"
                        placeholder="Enter course"
                        required
                    >
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-success">Add Student</button>
                    <a href="/admin/students" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <div class="footer">Library Management System © 2026</div>

</body>
</html>
