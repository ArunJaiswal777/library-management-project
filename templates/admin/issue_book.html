<!DOCTYPE html>
<html>
<head>
    <title>Issue Book</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">📚 Library Management</div>

        <div class="nav-links">
            <a href="/">🏠 Home</a>
            <a href="/admin/books">📚 Books</a>
            <a href="/admin/students">👨‍🎓 Students</a>
            <a href="/admin/issue-book" class="active">📖 Issue Book</a>
            <a href="/admin/issues">📋 Issues</a>
            <a href="/chatbot">🤖 Chatbot</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>Issue Book</h1>
                <p class="subtitle">Assign a book to a student</p>
            </div>
        </div>

        <div class="form-card">
            <form method="POST">
                <div class="form-group">
                    <label for="student_id">Student</label>
                    <select id="student_id" class="form-control" name="student_id" required>
                        {% for student in students %}
                        <option value="{{ student.id }}">
                            {{ student.name }} - {{ student.email }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="book_id">Book</label>
                    <select id="book_id" class="form-control" name="book_id" required>
                        {% for book in books %}
                        {% if book.available_quantity > 0 %}
                        <option value="{{ book.id }}">
                            {{ book.title }} - Available: {{ book.available_quantity }}
                        </option>
                        {% endif %}
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="issue_date">Issue Date</label>
                    <input class="form-control" type="date" id="issue_date" name="issue_date" required>
                </div>

                <div class="form-group">
                    <label for="due_date">Due Date</label>
                    <input class="form-control" type="date" id="due_date" name="due_date" required>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-success">Issue Book</button>
                    <a href="/admin/issues" class="btn btn-secondary">View Issues</a>
                </div>
            </form>
        </div>
    </div>

    <div class="footer">Library Management System © 2026</div>

</body>
</html>
